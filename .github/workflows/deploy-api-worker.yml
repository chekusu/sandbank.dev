name: Deploy API Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/api/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-api-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:api-worker
      - run: pnpm test:api-worker

  # Production deploys happen only here: after the checks pass on main, on the
  # sandbank-tyo runner reserved for public repositories, with keys from the
  # server's key store (deploy.sandbank.dev).
  deploy-api-worker:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, tyo-deploy-public]
    concurrency:
      group: production-deploy-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Load deploy keys
        run: vas-ci-env deploy.sandbank.dev

      - name: Ensure TYO node DNS
        continue-on-error: true
        env:
          CLOUDFLARE_ZONE_NAME: sandbank.dev
          DNS_RECORD_NAME: tyo-1.node.sandbank.dev
          DNS_RECORD_TYPE: A
          DNS_RECORD_CONTENT: 146.88.129.158
          DNS_RECORD_PROXIED: '0'
        run: node scripts/upsert-cloudflare-dns-record.mjs

      - name: Sync API worker secrets
        run: |
          set -euo pipefail

          sync_secret() {
            local name="$1"
            local value="${!name:-}"
            if [[ -z "$value" ]]; then
              echo "::notice::${name} is not in the key store (deploy.sandbank.dev); preserving any existing Worker secret."
              return
            fi
            printf '%s' "$value" | npx --yes wrangler@4.92.0 secret put "$name" --config workers/api/wrangler.toml
          }

          sync_secret PANEL_AUTH_FORWARDING_SECRET
          sync_secret CLERK_SECRET_KEY

      - name: Deploy API worker
        run: npx --yes wrangler@4.92.0 deploy --config workers/api/wrangler.toml
