name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Checks run on GitHub-hosted machines and never see a key.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:api-worker
      - run: pnpm test:api-worker
      - run: pnpm build

  sandbank-preflight:
    if: github.event_name == 'push'
    permissions:
      contents: read
      statuses: read
    uses: ./.github/workflows/sandbank-deploy-preflight.yml

  # Production deploys happen only here: after the checks pass on main, on the
  # sandbank-tyo runner reserved for public repositories, with keys from the
  # server's key store (deploy.sandbank.dev). Pull requests never reach it.
  deploy:
    needs: [check, sandbank-preflight]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.sandbank-preflight.outputs.should_deploy == 'true'
    runs-on: [self-hosted, tyo-deploy-public]
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Only the publishable key during the build; the Cloudflare token is loaded afterwards.
      - name: Load the panel build key
        run: vas-ci-env deploy.sandbank.dev VITE_CLERK_PUBLISHABLE_KEY
      - run: test -n "$VITE_CLERK_PUBLISHABLE_KEY"
      - run: pnpm build
        env:
          VITE_SANDBANK_API_BASE: ${{ vars.VITE_SANDBANK_API_BASE || 'https://cloud.sandbank.dev' }}

      - name: Load deploy keys
        run: vas-ci-env deploy.sandbank.dev CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.92.0 pages deploy dist --project-name=sandbank-dev --branch main --commit-hash "$GITHUB_SHA"
